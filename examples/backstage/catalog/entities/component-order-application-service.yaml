apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: order-application-service
  title: Order Application Service
  description: Coordinates validation, payment, and order creation.
  annotations:
    c4.io/alias: order_app_service
    c4.io/type: Component
    c4.io/sprite: server
    c4.io/technology: Python
    c4.io/tags: CoreComponent,Orders
spec:
  type: service
  lifecycle: production
  owner: group:default/platform-team
  system: order-processing
  dependsOn:
    - component:default/inventory-checker
    - component:default/payment-adapter
    - resource:default/order-database
    - resource:default/order-events-bus

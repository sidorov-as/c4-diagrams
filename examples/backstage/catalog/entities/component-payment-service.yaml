apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: payment-service
  title: Payment Service
  description: Wraps external payment provider calls.
  annotations:
    c4.io/alias: payment_service
    c4.io/type: Container
    c4.io/sprite: server
    c4.io/technology: Python
    c4.io/tags: CoreService,Payments
spec:
  type: service
  lifecycle: production
  owner: group:default/platform-team
  system: order-processing
  providesApis:
    - payment-api
  dependsOn:
    - resource:default/payment-gateway
  consumesApis:
    - payment-provider-api

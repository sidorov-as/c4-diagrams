app:
  title: Backstage C4 Demo
  baseUrl: http://localhost:7007

  # Discover frontend plugins from packages/app/package.json
  packages: all

  extensions:
    # Make the catalog index the root page
    - page:catalog:
        config:
          path: /

organization:
  name: C4 Demo

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:7007
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  providers:
    guest: {}

permission:
  enabled: true

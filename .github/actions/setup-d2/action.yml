name: "Setup D2"
description: "Install a pinned D2 CLI and expose it for tests"

inputs:
  d2-version:
    description: "D2 version to install (e.g. v0.9.0)"
    required: true
    default: "v0.9.0"

runs:
  using: "composite"
  steps:
    - name: Install D2
      shell: bash
      run: |
        set -euo pipefail

        VERSION="${{ inputs.d2-version }}"
        BIN_DIR="$HOME/.local/bin"

        echo "Installing D2 ${VERSION}..."
        # Download the release archive directly: d2lang.com/install.sh queries the
        # GitHub API without a token and fails with 403 on shared runner IPs.
        ARCHIVE="d2-${VERSION}-linux-amd64.tar.gz"
        mkdir -p "$HOME/.local"
        curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
          "https://github.com/d2lang/d2/releases/download/${VERSION}/${ARCHIVE}" \
          | tar -xz --strip-components=1 -C "$HOME/.local"

        export PATH="$BIN_DIR:$PATH"
        echo "$BIN_DIR" >> "$GITHUB_PATH"
        echo "D2_BIN=$BIN_DIR/d2" >> "$GITHUB_ENV"

        command -v d2

    - name: Show D2 version
      shell: bash
      run: d2 --version

name: Main

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks
        run: make check

  tests-and-type-check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        plantuml-version: ["1.2025.10"]
        mermaid-version: ["11.4.0"]
        d2-version: ["v0.9.0"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up PlantUML
        uses: ./.github/actions/setup-plantuml
        with:
          plantuml-version: ${{ matrix.plantuml-version }}

      - name: Set up Mermaid CLI
        uses: ./.github/actions/setup-mermaid
        with:
          mermaid-version: ${{ matrix.mermaid-version }}

      - name: Set up D2
        uses: ./.github/actions/setup-d2
        with:
          d2-version: ${{ matrix.d2-version }}

      - name: Run tests
        run: uv run python -m pytest tests -m "not likec4 and not structurizr" --cov --cov-config=pyproject.toml --cov-report=lcov

      - name: Upload coverage reports to Qlty.sh with GitHub Action on Python 3.12
        uses: qltysh/qlty-action/coverage@v2
        if: ${{ matrix.python-version == '3.12' }}
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage.lcov

      - name: Check typing
        run: uv run mypy

  likec4:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        likec4-version: ["1.60.0"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Set up LikeC4
        uses: ./.github/actions/setup-likec4
        with:
          likec4-version: ${{ matrix.likec4-version }}

      - name: Run LikeC4 tests (validate examples, export images)
        run: uv run python -m pytest tests -m likec4

  structurizr:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        structurizr-version: ["2026.06.28"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Set up Structurizr
        uses: ./.github/actions/setup-structurizr
        with:
          structurizr-version: ${{ matrix.structurizr-version }}

      - name: Run Structurizr tests (export images)
        run: uv run python -m pytest tests -m structurizr

  check-docs:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        plantuml-version: ["1.2025.10"]
        mermaid-version: ["11.4.0"]
        d2-version: ["v0.9.0"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Set up PlantUML
        uses: ./.github/actions/setup-plantuml
        with:
          plantuml-version: ${{ matrix.plantuml-version }}

      - name: Set up Mermaid CLI
        uses: ./.github/actions/setup-mermaid
        with:
          mermaid-version: ${{ matrix.mermaid-version }}

      - name: Set up D2
        uses: ./.github/actions/setup-d2
        with:
          d2-version: ${{ matrix.d2-version }}

      - name: Check if documentation can be built
        run: uv run zensical build -s
